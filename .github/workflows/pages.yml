name: 发布单片机实验台
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

      # 同一份产物同步到 Netlify（主站）。Netlify 跑在根路径，用 _redirects 把 GitHub Pages
      # 的 /lanqiao-mcu-lab/ 子路径重写到根下同名文件。
      - name: 发布到 Netlify
        run: |
          rm -rf .netlify-out && mkdir .netlify-out
          cp -r site/. .netlify-out/
          echo '/lanqiao-mcu-lab/*  /:splat  200' >> .netlify-out/_redirects
          npx --yes netlify-cli@26 deploy --prod --no-build --dir=.netlify-out --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
